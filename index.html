<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Visiter - نظام الزوار</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:system-ui;background:#f5f5f7;margin:0}
header{background:#6c4cff;color:#fff;padding:15px;text-align:center}
.container{max-width:500px;margin:30px auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 5px 20px #0001}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{background:#6c4cff;color:#fff;border:none;width:100%;padding:14px;border-radius:10px;font-size:18px;font-weight:bold}
#status{margin-top:15px;padding:10px;border-radius:8px;text-align:center}
</style>
</head>
<body>
<header><h1>💜 Mr Visiter - نظام الزوار</h1></header>
<div class="container">
<p style="text-align:center;color:#666">ادفع 0.01 Pi لتفعيل النظام</p>
<input id="apiKeyInput" placeholder="الصقي API Key هنا من Develop">
<button onclick="saveKey()" style="background:#ddd;border:none;padding:8px;border-radius:5px;width:100%">حفظ المفتاح</button>
<hr>
<button class="btn" onclick="pay()">💜 ادفع 0.01 Pi الآن</button>
<div id="status"></div>
</div>
<script>
const Pi = window.Pi;
Pi.init({version:"2.0", sandbox:false});
function saveKey(){
 const k=document.getElementById('apiKeyInput').value;
 localStorage.setItem('pi_api_key',k);
 document.getElementById('status').innerHTML='✅ تم حفظ المفتاح';
}
function pay(){
 document.getElementById('status').innerHTML='⏳ جاري فتح المحفظة...';
 Pi.createPayment({
  amount:0.01,
  memo:"تفعيل نظام الزوار Mr Visiter",
  metadata:{type:"activation"}
 },{
  onReadyForServerApproval:function(paymentId){
    document.getElementById('status').innerHTML='✅ تم الموافقة - جاري التأكيد...';
    // هنا لازم السيرفر يأكد، بس للتجربة بنعمل approve مباشر
    fetch('https://api.minepi.com/v2/payments/'+paymentId+'/approve',{method:'POST',headers:{'Authorization':'Key '+localStorage.getItem('pi_api_key')}});
  },
  onReadyForServerCompletion:function(paymentId,txid){
    document.getElementById('status').innerHTML='🎉 تم الدفع بنجاح! txid:'+txid;
    fetch('https://api.minepi.com/v2/payments/'+paymentId+'/complete',{method:'POST',headers:{'Authorization':'Key '+localStorage.getItem('pi_api_key')},body:JSON.stringify({txid:txid})});
  },
  onCancel:function(){document.getElementById('status').innerHTML='❌ تم الإلغاء';},
  onError:function(e){document.getElementById('status').innerHTML='❌ خطأ:'+e.message;}
 });
}
</script>
</body>
</html>
