<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mr Visiter - نظام الزوار</title>
<style>
body{font-family:system-ui;background:#f6f7fb;margin:0;padding:0}
header{background:#111;color:#fff;padding:20px;text-align:center}
.container{max-width:900px;margin:30px auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
input,button{padding:12px;border-radius:10px;border:1px solid #ddd;width:100%;margin:8px 0;font-size:16px}
button{background:#111;color:#fff;cursor:pointer}
.btn-pi{background:#6a1b9a;color:#fff;display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;margin-top:15px;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}
</style>
</head>
<body>
<header><h1>Mr Visiter 👁️</h1><p>نظام تسجيل الزوار</p></header>
<div class="container">
<h3>تسجيل زائر جديد</h3>
<input id="name" placeholder="اسم الزائر">
<input id="reason" placeholder="سبب الزيارة">
<button onclick="addVisitor()">إضافة</button>
<a class="btn-pi" href="/pay/">💜 ادفع 1 Pi لتأكيد الزيارة</a>
<table><thead><tr><th>الاسم</th><th>السبب</th><th>الوقت</th></tr></thead><tbody id="list"></tbody></table>
</div>
<script>
let visitors=JSON.parse(localStorage.getItem('vis')||'[]');
function render(){document.getElementById('list').innerHTML=visitors.map(v=>`<tr><td>${v.name}</td><td>${v.reason}</td><td>${v.time}</td></tr>`).join('')}
function addVisitor(){let n=document.getElementById('name').value,r=document.getElementById('reason').value;if(!n)return;visitors.unshift({name:n,reason:r,time:new Date().toLocaleString('ar')});localStorage.setItem('vis',JSON.stringify(visitors));render();document.getElementById('name').value='';document.getElementById('reason').value=''}
render();
</script>
</body>
</html>
