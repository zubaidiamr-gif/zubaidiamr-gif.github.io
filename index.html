<script src="https://sdk.minepi.io/pi-sdk.js"></script>
<script>
  const Pi = window.Pi;
  Pi.init({ version: "2.0", sandbox: false });

  async function pay() {
    try {
      const payment = await Pi.createPayment({
        amount: 0.01,
        memo: "تفعيل الحساب - منصة التعليم",
        metadata: { type: "activation" }
      }, {
        onReadyForServerApproval: function(paymentId) {
          console.log("جاهز للموافقة", paymentId);
          // هون لازم السيرفر يوافق
          // مثال: fetch('/approve', {method:'POST', body: JSON.stringify({paymentId})})
          // للتجربة على GitHub بنعمل موافقة وهمية مؤقتة
          fetch(`https://api.minepi.com/v2/payments/${paymentId}/approve`, {
            method: "POST",
            headers: { "Authorization": "Key YOUR_API_KEY_HERE" }
          });
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          console.log("مكتمل", paymentId, txid);
          alert("✅ تمت عملية الدفع بنجاح! تم تفعيل حسابك");
          localStorage.setItem("paid", "true");
          window.location.href = "/dashboard.html";
        },
        onCancel: function(paymentId) {
          alert("تم إلغاء الدفع");
        },
        onError: function(error, payment) {
          console.error(error);
          alert("خطأ في الدفع: " + error.message);
        }
      });
    } catch(err) {
      console.error(err);
    }
  }
</script>

<button onclick="pay()">ادفع 0.01 Pi للتفعيل</button>
