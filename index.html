<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التعليم</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script> Pi.init({ version: "2.0", sandbox: false }); </script>
<style>
body{font-family:Tahoma;text-align:center;padding:30px;background:#f9f9f9}
.box{background:white;padding:30px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
button{background:#6a1b9a;color:white;border:none;padding:15px 30px;font-size:18px;border-radius:10px;width:100%;cursor:pointer}
#status{margin-top:15px;color:#555}
</style>
</head>
<body>
<div class="box">
<h2>منصة التعليم</h2>
<p>تفعيل الحساب - 0.01 Pi</p>
<button onclick="pay()">ادفع 0.01 Pi</button>
<div id="status">افتحي من Pi Browser</div>
</div>
<script>
const PI_API_KEY = 

function onIncompletePaymentFound(p){
  document.getElementById('status').innerText = "جاري مسح دفعة عالقة...";
  return fetch(`https://api.minepi.com/v2/payments/${p.identifier}/cancel`, {
    method: 'POST',
    headers: { 'Authorization': `Key ${PI_API_KEY}` }
  });
}

async function pay(){
  const status = document.getElementById('status');
  try{
    const auth = await Pi.authenticate(['payments'], onIncompletePaymentFound);
    status.innerText = "أهلا " + auth.user.username;
    await Pi.createPayment({
      amount: 0.01,
      memo: "تفعيل حساب",
      metadata: {type: "activation"}
    }, {
      onReadyForServerApproval: (id) => {
        status.innerText = "جاري الموافقة...";
        fetch(`https://api.minepi.com/v2/payments/${id}/approve`, {
          method: 'POST',
          headers: { 'Authorization': `Key ${PI_API_KEY}` }
        });
      },
      onReadyForServerCompletion: (id, txid) => {
        status.innerText = "✅ تم الدفع " + txid;
        fetch(`https://api.minepi.com/v2/payments/${id}/complete`, {
          method: 'POST',
          headers: { 'Authorization': `Key ${PI_API_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({txid: txid})
        });
      },
      onCancel: () => status.innerText = "تم الإلغاء",
      onError: (e) => status.innerText = "خطأ: " + e.message
    });
  }catch(e){ status.innerText = "خطأ: " + e.message; }
}
</script>
</body>
</html>
