<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>منصة</title>
<script src="https://sdk.minepi.io/pi-sdk.js"></script>
<style>
* { box-sizing:border-box; }
body { margin:0; padding:20px; width:100%; overflow-x:hidden; text-align:center; font-family:Arial; background:#fff; }
h2 { font-size:22px; word-wrap:break-word; }
button { width:90%; max-width:300px; padding:18px; background:#7b33ff; color:#fff; border:0; border-radius:15px; font-size:20px; }
</style>
</head>
<body>
<h2>منصة التعليم</h2>
<p>تفعيل الحساب</p>
<button onclick="pay()">ادفع 0.01 Pi</button>
<script>
Pi.init({version:"2.0",sandbox:true});
function pay(){
 Pi.createPayment({amount:0.01,memo:"تفعيل",metadata:{x:1}},{
  onReadyForServerApproval:id=>alert("ID:"+id),
  onReadyForServerCompletion:(a,b)=>alert("تم الدفع"),
  onCancel:()=>alert("الغاء"),
  onError:e=>alert(e.message)
 });
}
</script>
</body>
</html>
