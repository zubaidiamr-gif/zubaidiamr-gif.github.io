<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr Visiter</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:system-ui;background:#f5f5f7;margin:0}
header{background:#6c4cff;color:#fff;padding:15px;text-align:center}
.container{max-width:500px;margin:20px auto;background:#fff;padding:20px;border-radius:15px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
.btn{background:#6c4cff;color:#fff;border:none;width:100%;padding:14px;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}
#status{margin-top:15px;padding:10px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<header><h1>💜 Mr Visiter</h1></header>
<div class="container">
<p style="text-align:center">ادفع Pi 0.01 لتفعيل النظام</p>
<input id="apiKeyInput" placeholder="الصقي API Key هنا">
<button onclick="saveKey()" style="width:100%;padding:10px;border-radius:8px;border:none;background:#eee">حفظ المفتاح</button>
<hr>
<button class="btn" onclick="pay()">💜 ادفع 0.01 Pi الآن</button>
<div id="status"></div>
</div>
<script>
const Pi = window.Pi;
Pi.init({version:"2.0", sandbox:false});
function saveKey(){
 localStorage.setItem('pi_api_key',document.getElementById('apiKeyInput').value);
 document.getElementById('status').innerHTML='✅ تم حفظ المفتاح';
}
async function pay(){
 document.getElementById('status').innerHTML='⏳ جاري تسجيل الدخول...';
 try{
  const scopes = ['payments'];
  const auth = await Pi.authenticate(scopes, (payment)=>{});
  document.getElementById('status').innerHTML='⏳ جاري فتح المحفظة...';
  Pi.createPayment({
   amount:0.01, memo:"تفعيل نظام الزوار", metadata:{type:"activation"}
  },{
   onReadyForServerApproval:function(id){
    document.getElementById('status').innerHTML='✅ موافقة...';
    fetch('https://api.minepi.com/v2/payments/'+id+'/approve',{method:'POST',headers:{'Authorization':'Key '+localStorage.getItem('pi_api_key')}});
   },
   onReadyForServerCompletion:function(id,txid){
    document.getElementById('status').innerHTML='🎉 تم الدفع بنجاح! '+txid;
    fetch('https://api.minepi.com/v2/payments/'+id+'/complete',{method:'POST',headers:{'Authorization':'Key '+localStorage.getItem('pi_api_key')},body:JSON.stringify({txid:txid})});
   },
   onCancel:function(){document.getElementById('status').innerHTML='❌ ألغيت';},
   onError:function(e){document.getElementById('status').innerHTML='❌ خطأ: '+e.message;}
  });
 }catch(e){document.getElementById('status').innerHTML='❌ خطأ تسجيل: '+e.message;}
}
</script>
</body>
</html>
