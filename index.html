<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Pay</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="text-align:center;padding:50px;font-family:Arial"><h2>Pi Payment Fixed</h2><button id="btn" style="padding:15px 30px;background:#7a2de2;color:#fff;border:0;border-radius:12px;font-size:18px">ادفع 1 Pi</button><p id="s"></p><script>
const BACKEND="https://3c3571f2-1201-4cc2-a296-342c1f12a4e5-00-h5df8mfkdfgt.sisko.replit.dev";
Pi.init({version:"2.0"});
const s=document.getElementById("s");
document.getElementById("btn").onclick=async()=>{
 s.innerText="جاري تسجيل الدخول...";
 try{
  await Pi.authenticate(["payments","username"],{
   onIncompletePaymentFound:(p)=>{
    s.innerText="بصلح دفعة معلقة...";
    return fetch(BACKEND+"/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction?p.transaction.txid:""})});
   }
  });
  s.innerText="تم الدخول، جاري الدفع...";
  await Pi.createPayment({amount:1,memo:"test",metadata:{}},{
   onReadyForServerApproval:(id)=>fetch(BACKEND+"/api/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id})}),
   onReadyForServerCompletion:(id,txid)=>fetch(BACKEND+"/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id,txid:txid})}).then(()=>s.innerText="✅ تم بنجاح!"),
   onCancel:()=>s.innerText="الغيت",
   onError:(e)=>s.innerText="Error "+e
  });
 }catch(e){s.innerText=e.message}
}
</script></body></html>
