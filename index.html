<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التعليم</title>
<script src="https://sdk.minepi.io/pi-sdk.js"></script>
</head>
<body style="text-align:center;padding:40px">
<h2>منصة التعليم - تفعيل الحساب</h2>
<button onclick="pay()" style="padding:15px 30px;background:#7b33ff;color:white;border:0;border-radius:10px;font-size:18px">ادفع 0.01 Pi للتفعيل</button>
<script>
Pi.init({version:"2.0",sandbox:false});
async function pay(){
 try{
  await Pi.createPayment({amount:0.01,memo:"تفعيل الحساب",metadata:{type:"activation"}},{
   onReadyForServerApproval:(id)=>{console.log(id)},
   onReadyForServerCompletion:(id,txid)=>{alert("✅ تم الدفع بنجاح");},
   onCancel:()=>alert("تم الإلغاء"),
   onError:(e)=>alert(e.message)
  });
 }catch(e){console.log(e)}
}
</script>
</body>
</html>
