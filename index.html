<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Payment Express</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family:Arial; text-align:center; padding:40px;">
<h2>Pi Payment Express</h2>
<button id="payBtn" style="padding:15px 30px; font-size:18px; background:#7a2de2; color:white; border:none; border-radius:10px;">Pay 1 Pi Test</button>
<p id="status"></p>
<script>
const BACKEND = "https://3c3571f2-1201-4cc2-a296-342c1f12a4e5-00-h5df8mfkdfgt.sisko.replit.dev";
Pi.init({ version: "2.0", sandbox: false });document.getElementById('payBtn').onclick = async () => {
  document.getElementById('status').innerText = "جاري الاتصال...";
  try {
    const scopes = ['payments'];
    await Pi.authenticate(scopes, (p) => console.log(p));
    await Pi.createPayment({ amount: 1, memo: "Test payment", metadata: { test: "1" } }, {
      onReadyForServerApproval: async (id) => {
        document.getElementById('status').innerText = "Approving...";
        await fetch(BACKEND + "/api/approve", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ paymentId: id }) });
      },
      onReadyForServerCompletion: async (id, txid) => {
        document.getElementById('status').innerText = "Completing...";
        await fetch(BACKEND + "/api/complete", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ paymentId: id, txid: txid }) });
        document.getElementById('status').innerText = "✅ تم الدفع بنجاح!";
      },
      onCancel: async (id) => {
        await fetch(BACKEND + "/api/cancel", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ paymentId: id }) });
        document.getElementById('status').innerText = "تم الالغاء";
      },
      onError: (e) => { document.getElementById('status').innerText = "Error: " + e; }
    });
  } catch (e) { document.getElementById('status').innerText = "Error: " + e.message; }
};
</script>
</body>
</html>
