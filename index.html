<script>
// رابط السيرفر تاعك
const BACKEND = "https://3c3571f2-1201-4cc2-a296-342c1f12a4e5-00-h5df8mfkdfgt.sisko.replit.dev";

function pay() {
  Pi.createPayment({
    amount: 0.1,
    memo: "test payment",
    metadata: {test: "1"}
  }, {
    onReadyForServerApproval: function(paymentId) {
      fetch(BACKEND + "/api/pi/approve", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({paymentId: paymentId})
      });
    },
    onReadyForServerCompletion: function(paymentId, txid) {
      fetch(BACKEND + "/api/pi/complete", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({paymentId: paymentId, txid: txid})
      }).then(() => alert("تم الدفع بنجاح!"));
    },
    onCancel: function(paymentId) {
      fetch(BACKEND + "/api/pi/cancel", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({paymentId: paymentId})
      });
    },
    onError: function(error) {
      console.log(error);
    },
    onIncompletePaymentFound: function(payment) {
      // هون الحل النهائي للمشكلة
      console.log("Found incomplete", payment);
      fetch(BACKEND + "/api/pi/cancel", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({paymentId: payment.identifier})
      })
      .then(() => {
        alert("تم إلغاء الدفعة المعلقة، اضغط ادفع مرة ثانية");
        location.reload();
      });
    }
  });
}
</script>
